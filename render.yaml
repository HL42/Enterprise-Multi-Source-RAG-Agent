# ============================================================
# Render Blueprint — Enterprise HR/IT Support Agent
# ============================================================

services:
  - type: web
    name: rag-agent
    env: node
    region: singapore

    buildCommand: npm install && npm run build
    startCommand: npm start

    healthCheckPath: /

    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false

    plan: free
